<!doctype html><meta charset="utf-8"><title>分层三层试拼</title><style>body{background:#ddd;font:16px sans-serif} .stage{position:relative;width:512px;height:768px;background:#fff;display:inline-block}img{position:absolute;transform-origin:0 0}h1{font-size:20px}</style><h1>三层试拼（缺失其他部件，定位验证用）</h1><div class="stage" id="rig"></div><div class="stage"><img width="512" src="../../hd-v5-natural-tail/idle.png"></div><script>const layers=[['hair-back',[20,136,1003,1111],[94,62,950,825]],['body',[333,446,735,998],[385,435,650,765]],['face-base',[323,176,702,572],[346,146,690,453]]];for(const[id,b,t]of layers){let x=(t[2]-t[0])/(b[2]-b[0]),y=(t[3]-t[1])/(b[3]-b[1]);let i=new Image;i.src=id+'.png';i.width=1024;i.height=1536;i.style.transform=`matrix(${x*.5},0,0,${y*.5},${(t[0]-b[0]*x)*.5},${(t[1]-b[1]*y)*.5})`;rig.append(i)}</script>
