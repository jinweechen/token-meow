<style>
:root{font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17221f;color:#edf5ef}header{padding:24px 28px 16px;max-width:1600px;margin:auto}h1{font-size:25px;margin:0 0 6px}p{margin:6px 0;color:#b9cbc1}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button,a.control{font:inherit;padding:7px 12px;border:1px solid #6d8779;background:#293e34;color:inherit;border-radius:7px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{border-color:#c6edaa;background:#385538}.grid{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:16px;max-width:1600px;margin:auto;padding:12px 28px 28px}.card{border:1px solid #51665a;border-radius:12px;overflow:hidden;background:#25342d}.card h2{font-size:16px;margin:0;padding:12px 14px 8px}.stage{background:#0d1511;position:relative}.card .stage{height:420px}.stage img{display:block;width:100%;height:100%;object-fit:contain}.stage a{display:block;height:100%}.card .notes{min-height:100px;padding:12px 14px;font-size:13px;color:#bbd0c2}.grid .notes p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.grid .notes ul{display:none}.grid .notes{min-height:135px}.status{color:#e3d5a5;font-size:12px;margin-left:10px}.missing{position:absolute;inset:40% 0;text-align:center;color:#78917f}.card .stage img{position:relative}.light .stage{background:#f4f3ef}.checker .stage{background-color:#e4e8e2;background-image:linear-gradient(45deg,#bcc7bd 25%,transparent 25%),linear-gradient(-45deg,#bcc7bd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bcc7bd 75%),linear-gradient(-45deg,transparent 75%,#bcc7bd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.detail{padding:12px 28px 32px;display:grid;grid-template-columns:minmax(600px,1050px) minmax(260px,420px);gap:20px;align-items:start;max-width:1600px;margin:auto}.detail .stage{overflow:auto;border:1px solid #51665a;border-radius:12px;max-height:calc(100vh - 220px);min-height:640px}.detail .stage img{height:1200px;width:auto;max-width:none;margin:auto}.detail.native .stage img{height:auto;width:auto;max-width:none}.detail .review-column{display:grid;gap:16px}.detail .crop{width:100%;height:390px;min-height:0;overflow:hidden;position:relative}.detail .crop img{position:absolute;max-width:none;margin:0;object-fit:initial}.detail .crop span.caption{position:absolute;left:0;top:0;z-index:2;background:#25392ee8;padding:5px 9px;color:#fff}.detail .notes{position:sticky;top:20px;background:#26392f;padding:20px;border-radius:12px}.detail h2{margin:0 0 10px}.detail ul{padding-left:20px;color:#b9cbc1}.board{grid-column:1/-1}.board .stage{height:640px}.board .stage img{max-width:1400px;margin:auto}.raw{color:#cee8af}.hint{font-size:13px}footer{padding:0 28px 32px;max-width:1600px;margin:auto;color:#95ad9e;font-size:13px}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(180px,1fr))}.detail{grid-template-columns:1fr}.detail .notes{position:static}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(130px,1fr));padding:12px}.card .stage{height:300px}header{padding:20px 14px}.detail{padding:12px}.detail .stage{min-height:400px}.board .stage{height:420px}}
</style></head><body class="dark"><header><h1>Nekomi v5 · 高清设计素材</h1><p>12 张独立姿势与三视图设定板。页面直接读取原始 PNG，缩放只影响浏览器显示。</p><p id="summary" class="hint">素材与逐张视觉结论填充前，页面保持待检查状态。</p><nav><button data-theme="dark">深色背景</button><button data-theme="light">浅色背景</button><button data-theme="checker">透明棋盘</button><a class="control" href="?">全部姿势</a><a class="control" href="?pose=turnaround">三视图</a><button id="native">原生像素显示</button></nav></header><main></main><footer>这是图像素材检查页。技术数值通过不等于人体结构或动画已验证；每张的检查结论和限制分别记录。</footer>

const ASSET_BASE = ".";
const REVIEW_DATA = {"idle": {"technicalPass": true, "visibleHeight": 1446, "decision": "approved-with-notes", "conclusion": "Slimmer, lightly furry cylindrical segment with gradual taper and a small curved tip. The visible segment is behind the right lower skirt contour. Clear separation from the calf; no long tangent against the leg. This front view alone does not establish the hidden center-back outlet. Both thumb silhouettes are separate. The long fingers are grouped in a relaxed downward pose with distinguishable outlines and overlapping depth. Enlarged views show no clear branched fingertip, interpenetration, or fused multi-prong finger. Five fully spread fingertips are not visible, which is compatible with this pose. Both rounded shoe fronts face substantially forward and remain approximately parallel; no clear inward-toed pose. The waist ribbon sits at the lower torso rather than under the collar/chest; a readable bodice separates neckline and skirt. Ruffles and hands overlap coherently. Stable stylized large-head chibi proportions. Limbs are continuous; shoulders, elbows, wrists, knees and shoe placement do not show a clear structural defect at the observed views. Browser compositing on dark and light backgrounds shows clean readable silhouettes. Colored RGB outside the alpha mask must not be interpreted as a visible glow.", "limitations": ["The hidden tail route and clothing opening require turnaround confirmation.", "This is visual anatomy review of a stylized 2D image, not a skeletal rig verification."]}, "active": {"technicalPass": true, "visibleHeight": 1447, "decision": "approved-with-notes", "conclusion": "Tail remains a continuous lightly furry cylinder behind the skirt, with an outward/downward wave and a modest rounded curl. Visible middle and tip are slightly fuller than idle but do not read as the former broad pointed brush; this pose does not show a clear volume inconsistency requiring repair. Clear gap from calf. Original and enlarged browser views show five separate waving fingers with a distinct thumb, sensible staggering and no bifurcated tips. Lowered hand is seen side/back with coherent overlapping long fingers. Forward parallel shoes and unpinched knees. Natural waist, collar, bows and two groups of three skirt flowers preserve the design. Dark compositing around hair, hand and sleeve is clean.", "limitations": ["Front view occludes tail root; no independent claim about hidden joint geometry."]}, "complete": {"technicalPass": true, "visibleHeight": 1469, "decision": "approved-with-notes", "conclusion": "Single slim cylindrical tail with a deeper terminal curl; shaft and overall fur mass remain compatible with the master. Skirt occludes the proximal route; no apparent lateral attachment or calf tangent. Original PNG and browser detail show two small closed fists with thumb/curl overlap; no visible branching or extra digit. The initial browser detail window partly clipped the right fist and was reported for UI correction; original full PNG shows it intact. Forward shoes, stable separated knees. Waist sits below the readable bodice; floral pattern and ruffles remain coherent.", "limitations": ["Front view occludes tail root; no independent claim about hidden joint geometry."]}, "alert": {"technicalPass": true, "visibleHeight": 1498, "decision": "approved-with-notes", "conclusion": "Single lightly furry cylindrical tail swings somewhat farther outward, remains continuous and separated from the leg. It is not rejected simply for different visible length or curve. Original and enlarged browser inspection show fingers on one upper arm with coherent overlap; the opposite hand is partly tucked beneath the arm. No obvious branching, interpenetration, or broken wrist/sleeve connection. Forward aligned shoes and separated knees. Natural waist and six-flower skirt design remain intact. Light browser composite shows clean arm/sleeve outlines.", "limitations": ["Tucked-hand fingers are intentionally occluded rather than independently visible."]}, "sleep": {"technicalPass": true, "visibleHeight": 1483, "decision": "approved-with-notes", "conclusion": "A single light tapered cylindrical tail behind the skirt, with a gentle curved tip and clear calf gap. Final original PNG shows a coherent pair of relaxed overlapping hands, with distinct outer contours and grouped fingers rather than a forked digit. The initial browser detail window clipped the fingertips, so the window is being corrected separately; it is not an image defect. Forward aligned shoes and separated legs. Final repaired PNG has exactly two large and four small skirt flowers, in two groups. Original final PNG independently inspected.", "limitations": ["Some digits are partly covered by the opposite hand; this is not a five-finger spread."]}, "shy": {"technicalPass": true, "visibleHeight": 1470, "decision": "approved-with-notes", "conclusion": "Repaired slender lightly furry cylindrical tail remains continuous behind lower skirt, with clear air separation from calf and a soft tapered tip. Original and corrected2x browser regions inspected. Cheek-touching fingers are flexed in a side view with overlapping/hidden digits; no clear forked fingertip, broken attachment or intersecting fingers. Lowered hand has separate thumb and distinguishable grouped finger edges. Forward approximately parallel Mary Jane shoes; no inward knee pinch. Head tilt and expression preserve the master identity, garment waist and proportions. Light browser composite shows no background halo; ear outlines remain complete.", "limitations": ["Top ear has only approximately4px alpha16 margin, although the contour is intact in the viewed original. No cropping occurred in this source; future canvas extraction should preserve the full image.", "Bent/overlapping fingers cannot be treated as a visible five-finger spread."]}, "affection": {"technicalPass": true, "visibleHeight": 1489, "decision": "approved-with-notes", "conclusion": "Local repair now has a lighter cylindrical shaft, modest short fur and a softly rounded distal tip, compatible with idle master volume. It appears behind the lower skirt and curves downward with clear separation from the calf; no long tangent or dangling detached tuft. Both hands face the chest rather than flat palms toward camera. Thumb and grouped fingertips form coherent attachment and overlap; original and enlarged browser view reveal no clear branching or fusion. The two shoes face forward without clear inward-toe stance. Natural waist ribbon and collar/bow/flowers preserve the master design. The repaired original PNG was independently viewed again; hand gestures, forward feet, face and costume remain coherent without a new clear defect.", "limitations": ["Tail root is hidden and cannot independently prove garment opening.", "Comparison of width is visual, not a skeleton or pixel segmentation measurement."]}, "stretch": {"technicalPass": true, "visibleHeight": 1477, "decision": "approved-with-notes", "conclusion": "Repaired tail now has a light cylindrical short-fur silhouette with a modest terminal curl. It remains behind lower skirt, distinct from calf, and compatible with the idle volume. Original and enlarged browser views confirmed a separate thumb and four long fingers on the mouth-covering hand; raised loose fist has plausible curled-digit overlap with no clear extra or forked fingers. Forward shoes, separated knees, stable upright lower limbs. Waist and bodice remain coherent despite raised arm. Light-background browser composite remains clean around the hands and sleeves.", "limitations": ["Tail shaft-width estimate is visual."]}, "wink": {"technicalPass": true, "visibleHeight": 1432, "decision": "approved-with-notes", "conclusion": "Root independently inspected the final full PNG and both enlarged browser hand windows. The lowered hand now has a separate thumb and gently curved overlapping long fingers. The prior triangular finger gap and intersecting angular red lines are removed. No clear forked digit, detached fingertip or implausible hand attachment was observed. The hip-resting hand remains coherent. The final full image shows separated knees and forward-facing shoes, without the previously rejected inward shoe rotation. Two large and four small skirt flowers, the natural waist ribbon and balanced daisy hairbows remain coherent in the final full-image inspection. Single light, slightly furry cylindrical tail curves behind the lower skirt with a clear gap from the calf and one tapered curved tip. Hidden proximal attachment is explained by the shared rear-opening turnaround. Both ears and shoes are fully inside the canvas. The recorded alpha16 top margin is 37 pixels and no visible contour touches the canvas edge. The actual final PNG was composited in the browser; the hand contour is readable on the light background without a visible halo. This check used the alpha composite, not colored RGB under zero alpha.", "limitations": ["The relaxed fingers overlap; five widely separated fingertips are not expected for this gesture.", "This is visual acceptance of a stylized static illustration, not a skeletal or animation-continuity verification."]}, "happy": {"technicalPass": true, "visibleHeight": 1493, "decision": "approved-with-notes", "conclusion": "Light continuous cylindrical tail, slightly fuller at the curved end but not a broad pointed brush. It arcs outward with clear separation from the legs and no long tangent. Original and separate2x browser windows show two small closed fists with plausible thumb/finger overlap and no clearly forked or extra digits. Separated knees and forward/slightly outward shoe alignment; not pigeon-toed. Two large plus four small skirt flowers and natural waist match the identity design. Dark composite around fists and cuffs is clean.", "limitations": ["Top margin is small (reported alpha16 approximately6px), with intact ear contour in the viewed source."]}, "bow": {"technicalPass": true, "visibleHeight": 1444, "decision": "approved-with-notes", "conclusion": "Single lightly furry cylindrical tail emerges behind the lower skirt, keeps a gentle downward arc and small terminal curl, with no long calf tangent. Volume remains compatible with idle rather than a broad fox brush. Original and enlarged browser views inspected. The front hand has a distinct thumb and four downward grouped fingers. Rear hand and fingertips are partly covered in coherent overlap; no obvious branching or fusion. Forward shoes with unpinched knees; no pigeon toes. Closed eyes, lowered head and forward gathered arms read as a small polite bow, not a deep waist bow. Natural waist and recognizable neckline, bows, floral hem and ruffles are preserved. Dark composite has clean readable contours and no visible background glow.", "limitations": ["The bow is intentionally shallow in the 2D pose.", "Hidden proximal tail route derives from the common construction reference, not this front image alone."]}, "hug-tail": {"technicalPass": true, "visibleHeight": 1436, "decision": "approved-with-notes", "conclusion": "The proximal visible curve comes from behind the right hair/forearm, bends forward and remains continuous across the supporting hands to a single distal tip. This is materially better than earlier detached-fur-prop versions; it is not rejected merely for being visible beside an arm. Final original PNG retains a supporting hand with separate thumb and four bent long fingers and an opposite cupping hand with plausible occlusion; no new clearly broken or forked digit. Forward and separated shoes/legs. Final repaired PNG restores two large plus four small flowers, with the held tail naturally covering the lower center dress area. Final native reframing restores an intact ear outline with reported alpha16 top55px, bottom45px and visible character height1436px. Independently viewed the final full PNG again.", "limitations": ["Front proximal root remains occluded; rear attachment is supported by shared turnaround, not directly exposed here."]}, "turnaround": {"technicalPass": true, "visibleHeight": null, "decision": "approved-with-notes", "conclusion": "Front distal tail is at viewer-right and back distal tail at viewer-left: these agree on the character-left side. Back view visibly places the small finished flap/opening on the center back of the clothed upper hip below the waist. Side view hides the short proximal segment behind hair/dress before the tail extends backward/downward, compatible with this route. No obvious disconnection or second tail. Green eyes, lavender-white curls, daisy hairbows, dress collar, floral skirt, tights, shoes and stylized head/body scale remain recognizable across the three views. Side shoe heel and rear heel views are plausible. Ear tips and soles are closely aligned, with a true side-facing middle view. The back waist now has the green wraparound ribbon, with a small daisy closure above the separate center-back tail opening. Front/side/back tail laterality and route remain consistent after this local repair.", "limitations": ["The sheet is a coherent illustration guide, not geometric proof from a single 3D model.", "Side proximal root is occluded; the back view supplies the explicit opening evidence."]}};
const poses=['idle','active','complete','alert','sleep','shy','affection','stretch','wink','happy','bow','hug-tail'];
const labels=['待机','互动','完成','提醒','困倦','害羞','亲昵','伸展','眨眼','开心','鞠躬','抱尾'];
const entries=poses.map((pose,i)=>({pose,label:labels[i],file:pose+'.png'})).concat([{pose:'turnaround',label:'正面 · 侧面 · 背面结构设定',file:'reference/turnaround.png'}]);
const params=new URLSearchParams(location.search);const main=document.querySelector('main');const focus=entries.find(e=>e.pose===params.get('pose'));
const crops={idle:[[590,840,1.2,'尾巴与腿部'],[200,680,1.4,'左手与袖口'],[620,680,1.4,'右手与袖口']],active:[[590,840,1.2,'尾巴与腿部'],[180,400,1.4,'招手手部'],[620,680,1.4,'自然垂手']],complete:[[590,840,1.2,'尾巴与腿部'],[400,440,1.6,'双手细节']],alert:[[590,840,1.2,'尾巴与腿部'],[340,520,1.3,'双手细节']],sleep:[[590,840,1.2,'尾巴与腿部'],[420,730,2,'双手细节']],shy:[[590,840,1.2,'尾巴与腿部'],[340,360,2,'触脸手部'],[650,760,2,'自然垂手']],affection:[[590,840,1.2,'尾巴与腿部'],[270,480,1.4,'抚胸手部']],stretch:[[590,840,1.2,'尾巴与腿部'],[650,30,1.4,'上举手部'],[330,320,1.4,'嘴边手部']],wink:[[590,840,1.2,'尾巴与腿部'],[350,550,2,'叉腰手部'],[690,740,2,'自然垂手']],happy:[[590,840,1.2,'尾巴与腿部'],[300,430,2,'左手细节'],[590,450,2,'右手细节']],bow:[[590,840,1.2,'尾巴与腿部'],[300,650,1.4,'双手细节']],'hug-tail':[[580,720,1.5,'尾巴近端连续性'],[300,760,1.8,'左手与尾尖'],[560,740,1.8,'右手托尾']]};
const statusLabels={'approved':'已检查','approved-with-notes':'已检查，附限制','needs-revision':'需修改','not-reviewed':'待检查'};
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setTheme(theme){document.body.className=['dark','light','checker'].includes(theme)?theme:'dark';document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===document.body.className));}setTheme(params.get('theme')||'dark');
document.querySelectorAll('[data-theme]').forEach(button=>button.onclick=()=>setTheme(button.dataset.theme));
function imageMarkup(entry){return '<span class="missing">'+escapeHtml(entry.label)+' · 等待素材</span><img src="'+ASSET_BASE+'/'+entry.file+'" alt="'+escapeHtml(entry.label)+'" onload="this.previousElementSibling.hidden=true" onerror="this.hidden=true">';}

if(focus){main.className='detail';main.innerHTML='<section class="stage">'+imageMarkup(focus)+'</section><aside class="notes"><h2>'+escapeHtml(focus.label)+'</h2>'+notes(focus)+'<p><a class="raw" href="'+ASSET_BASE+'/'+focus.file+'" target="_blank">打开原始 PNG</a></p><p class="hint">默认画布显示高度 1200 px；原生像素模式保留文件尺寸，可滚动检查。背景切换不会修改原图。</p></aside>';}else{main.className='grid';main.innerHTML=entries.map((entry,i)=>'<article class="card '+(entry.pose==='turnaround'?'board':'')+'"><h2>'+String(i+1).padStart(2,'0')+' · '+escapeHtml(entry.label)+'</h2><div class="stage"><a href="?pose='+entry.pose+'&theme='+document.body.className+'">'+imageMarkup(entry)+'</a></div><div class="notes">'+notes(entry)+'</div></article>').join('');}
if(focus&&crops[focus.pose]){const aside=main.querySelector('aside');const column=document.createElement('div');column.className='review-column';aside.replaceWith(column);column.append(aside);for(const [x,y,scale,title] of crops[focus.pose]){const panel=document.createElement('section');panel.className='stage crop';panel.innerHTML='<span class="caption">'+escapeHtml(title)+'</span><img src="'+ASSET_BASE+'/'+focus.file+'" style="width:'+(1024*scale)+'px;height:'+(1536*scale)+'px;left:'+(-x*scale)+'px;top:'+(-y*scale)+'px">';column.append(panel);}}
document.getElementById('native').onclick=()=>{if(focus){main.classList.toggle('native');document.getElementById('native').textContent=main.classList.contains('native')?'1200 px 画布显示':'原生像素显示';}else{location.search='?pose=idle&theme='+document.body.className;}};
const reviewed=Object.values(REVIEW_DATA).filter(r=>['approved','approved-with-notes'].includes(r.decision)).length;document.getElementById('summary').textContent='当前收录检查记录 '+Object.keys(REVIEW_DATA).length+' / 13，附视觉结论的已检查图像 '+reviewed+' / 13。';
