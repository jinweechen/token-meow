<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>猫娘完整动作素材 v12</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3ec;color:#253e2e;font:14px system-ui}main{padding:24px;max-width:1600px;margin:auto}h1{font-size:25px;margin:0 0 12px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:15px 0}select,button{font:inherit;padding:8px;border:1px solid #b8c9b7;border-radius:6px;background:white;color:#25482e}button{cursor:pointer}.layout{display:flex;gap:20px;align-items:flex-start}.stage{flex:none;position:relative;overflow:hidden;background:#fff;background-image:conic-gradient(#e0e7dc 25%,transparent 0 50%,#e0e7dc 0 75%,transparent 0);background-size:24px 24px;width:256px;height:384px}.stage img{position:absolute;inset:0;width:100%;height:100%}body.dark .stage{background:#202a23}body.light .stage{background:#fff9ed}.strip{display:flex;gap:10px;flex-wrap:wrap;flex:1;align-content:flex-start}.tile{background:white;border:1px solid #c9d6c4;padding:7px;width:145px}.tile img{display:block;width:128px;height:192px;object-fit:contain;background:#eaf0e7}.tile.active{border:2px solid #3e8955}.meta{font-size:12px;line-height:1.7;white-space:pre-wrap}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}.gallery figure{margin:0;padding:12px;background:white;border:1px solid #c9d6c4}.gallery img{width:100%;height:300px;object-fit:contain;background:#eaf0e7}.gallery figcaption{font-weight:600}p{line-height:1.7}.badge{color:#6b6d4c}
</style><main><h1>猫娘 v12 · 12 动作、双向行走与掉头</h1><p class="badge">制作预览：新画过渡和主体，复用适用的历史帧；小幅比例与饰件差异保留。此页只展示素材。</p>
<nav><label>动作 <select id="clip"></select></label><button id="play" disabled>播放完整动作</button><button id="step" disabled>下一帧</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select></label><label>背景 <select id="bg"><option value="checker">棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>人物大小 <select id="scale"><option value="269">约269px桌宠</option><option value="1200">约1200px</option></select></label></nav>
<p id="status">加载中</p><div class="layout"><div class="stage" id="stage"></div><div><p id="current" class="meta"></p><div id="strip" class="strip"></div></div></div><h2>主体总览</h2><div id="gallery" class="gallery"></div></main>
<script>
let data,imgs=new Map(),idx=0,playing=false,timer=0,trace=[];const $=id=>document.getElementById(id);const current=()=>data.clips[Number($('clip').value)];
function stop(){playing=false;clearTimeout(timer);$('play').textContent='播放完整动作'}
function show(i){idx=i;const clip=current(),f=clip.frames[i];$('stage').replaceChildren(imgs.get(f.path).cloneNode());$('current').textContent=clip.label+' | '+(i+1)+'/'+clip.frames.length+' | '+f.segment+' | '+f.durationMs+'ms\n'+f.path;[...$('strip').children].forEach((e,j)=>e.classList.toggle('active',i===j));trace.push({clip:clip.id,index:i,path:f.path,segment:f.segment,t:Math.round(performance.now())})}
function advance(){if(!playing)return;const c=current();if(idx>=c.frames.length-1){stop();return}show(idx+1);timer=setTimeout(advance,c.frames[idx].durationMs/Number($('speed').value))}
function select(){stop();idx=0;const c=current();$('strip').innerHTML='';c.frames.forEach((f,i)=>{const e=document.createElement('button');e.className='tile';e.innerHTML='<span>'+f.segment+' · '+f.durationMs+'ms</span>';e.append(imgs.get(f.path).cloneNode());e.onclick=()=>{stop();show(i)};$('strip').append(e)});show(0);$('play').disabled=false;$('step').disabled=false}
$('play').onclick=()=>{if(playing){stop();return}show(0);playing=true;$('play').textContent='暂停';timer=setTimeout(advance,current().frames[0].durationMs/Number($('speed').value))};$('step').onclick=()=>{stop();show((idx+1)%current().frames.length)};$('clip').onchange=select;$('bg').onchange=()=>document.body.className=$('bg').value;$('scale').onchange=()=>{const h=Number($('scale').value)*1536/1473;$('stage').style.height=h+'px';$('stage').style.width=h*2/3+'px'};
fetch('catalog-v12.json',{cache:'no-store'}).then(r=>r.json()).then(async d=>{data=d;let missing=0;for(const p of new Set(d.clips.flatMap(c=>c.frames.map(f=>f.path)))){const im=new Image();im.src=p;await new Promise(res=>{im.onload=res;im.onerror=()=>{missing++;res()}});imgs.set(p,im)}$('status').textContent=missing?'缺少 '+missing+' 张，播放暂停':'全部 '+imgs.size+' 张图已加载 · '+d.clips.length+' 段素材预览';if(missing)return;d.clips.forEach((c,i)=>{$('clip').add(new Option(c.label,i));const f=c.frames.find(f=>f.segment==='body');const el=document.createElement('figure');el.innerHTML='<figcaption>'+c.label+'</figcaption>';el.append(imgs.get(f.path).cloneNode());el.onclick=()=>{$('clip').value=i;select();window.scrollTo(0,0)};$('gallery').append(el)});select();$('scale').onchange()});
window.reviewState=()=>({trace,playing,clip:current()?.id,index:idx,loaded:imgs.size});window.clearReviewTrace=()=>{trace=[]};
</script></html>
