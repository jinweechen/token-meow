<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>侧走素材 · 8个关键姿势</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#2c4036;background:#f1f4f0}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:1460px;margin:auto;padding:25px 24px 32px}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0}p{margin:0}.intro{font-size:14px;line-height:1.7;color:#667665}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:11px 17px;background:#fff;border:1px solid #d7e1d7;border-radius:11px;padding:13px 15px;margin:19px 0 15px}label{font-size:13px;display:flex;align-items:center;gap:7px}select,button{font:inherit;border:1px solid #c9d6ca;border-radius:7px;background:#fff;color:#36553f;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#326e4a;text-underline-offset:3px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c9a054;outline-offset:3px}.toolbar a{font-size:13px}.summary{font-size:13px;line-height:1.7;color:#607160;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.tile{border:1px solid #d6dfd5;border-radius:11px;overflow:hidden;background:#fff;min-width:0}.tile.selected{border-color:#397d54;box-shadow:0 0 0 2px #397d5429}.tile-head{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:9px 10px}.tile-head button{border:0;padding:0;text-align:left;font-size:12px;font-weight:650}.tile-head a{font-size:11px;white-space:nowrap}.stage{overflow:auto;display:flex;align-items:safe center;justify-content:safe center;min-width:0;background-color:#fff;background-image:linear-gradient(45deg,#e6ebe5 25%,transparent 25%),linear-gradient(-45deg,#e6ebe5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6ebe5 75%),linear-gradient(-45deg,transparent 75%,#e6ebe5 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}.light .stage{background:#fcfaf3}.dark .stage{background:#222a25}.grid-stage{height:clamp(210px,32vh,380px)}.window{position:relative;overflow:hidden;flex:none}.canvas{position:absolute;left:0;top:0;transform-origin:top left}.canvas img{position:absolute;inset:0;display:block;width:100%;height:100%}.placeholder{position:absolute;inset:0;display:grid;align-content:center;text-align:center;padding:15px;color:#6d7b68;background:#ffffffbd;font-size:13px;line-height:1.8}.dark .placeholder{color:#c5cfc4;background:#222a25c7}.tile-note{min-height:41px;padding:8px 10px;font-size:11px;color:#71806c;line-height:1.6}.single{border:1px solid #d6dfd5;background:#fff;border-radius:12px;overflow:hidden;margin-top:24px;scroll-margin-top:12px}.single-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.single-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 18px 14px}.single-controls a{font-size:13px;margin-left:4px}.single-stage{height:min(74vh,850px);min-height:320px}.play-note{padding:12px 18px;background:#f5f0df;color:#776131;font-size:12px;line-height:1.8}.frame-notes,.review-notes{font-size:12px;line-height:1.8;color:#66795f;padding:10px 18px 15px}.frame-notes p+p,.review-notes p+p{margin-top:6px}.review{margin-top:16px}.review h2{font-size:15px}.review-notes{padding:8px 0}.error{background:#fff0eb;border:1px solid #e4b7aa;color:#924f40;padding:12px;border-radius:9px;margin:15px 0;font-size:13px;line-height:1.8}.foot{font-size:12px;color:#75816c;line-height:1.8;margin-top:13px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:17px 11px}.grid{gap:9px}.tile-head{align-items:flex-start;flex-direction:column;gap:5px}.tile-head button{font-size:11px}h1{font-size:23px}.toolbar{gap:10px;padding:12px}.grid-stage{height:240px}.single-controls{padding:0 10px 12px}.single-head{padding:13px 10px}.frame-notes,.play-note{padding:10px}.single-stage{height:65vh}.intro{font-size:13px}}
  </style>
</head>
<body class="checker">
  <main>
    <header><h1 id="title">侧走素材 · 8个关键姿势</h1><p class="intro">计划汇集八张实际人物 PNG，已加载数量见下方。先对照姿势，再检查衔接；加载完成不代表动作通过验收。</p></header>
    <div class="toolbar">
      <label>背景 <select id="background"><option value="checker">透明棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>查看范围 <select id="focus"><option value="full">完整人物</option><option value="hands">手部</option><option value="feet">脚部</option></select></label>
      <button id="reload" type="button">刷新清单与素材</button><a href="#single">查看选中帧 ↓</a>
    </div>
    <p id="summary" class="summary" role="status">正在读取素材清单…</p>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="grid" class="grid" aria-label="八个关键姿势完整网格"></section>
    <section id="single" class="single">
      <div class="single-head"><h2 id="frameTitle">单帧检查</h2><label>单帧大小 <select id="zoom"><option value="fit">适合窗口</option><option value="1">原图 1×</option><option value="2">放大 2×</option></select></label></div>
      <div class="single-controls">
        <button id="previous" type="button" disabled>上一帧</button><select id="frameSelect" aria-label="选择关键姿势" disabled></select><button id="next" type="button" disabled>下一帧</button>
        <button id="play" type="button" disabled>动作检查播放</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select></label>
        <a id="download" href="#" download>下载本帧原图</a>
      </div>
      <div id="singleStage" class="stage single-stage"><div id="singleWindow" class="window"><div id="singleCanvas" class="canvas"></div><div id="singlePlaceholder" class="placeholder">等待素材</div></div></div>
      <p id="playNote" class="play-note">八张全部加载成功后，可进行 8 帧动作粗检查。默认暂停；这不是运行时验收。</p>
      <div id="frameNotes" class="frame-notes"></div>
    </section>
    <section class="review"><h2>检查记录</h2><div id="reviewNotes" class="review-notes"></div></section>
    <p class="foot">固定 1024×1536 画幅，所有帧保持同一显示比例与原始位置；手脚视图只改变查看范围。播放直接切换原 PNG，不做插值、变形或镜像。<a href="sequence-v11.json">查看素材清单</a></p>
  </main>
  <script>
    'use strict';
    const $=id=>document.getElementById(id),areas={full:{x:0,y:0,w:1024,h:1536},hands:{x:0,y:620,w:1024,h:530},feet:{x:0,y:1060,w:1024,h:476}};
    const names={'pending-review':'待复核','needs-refinement':'待细修','rejected':'未通过','reviewed-static':'已记录静态检查','approved-static':'已记录静态检查'};
    let sequence=null,states=[],tiles=[],current=0,epoch=0,playing=false,raf=0,lastTime=0,elapsed=0,retryTimer=null;
    function asset(path){const u=new URL(path,location.href),base=new URL('.',location.href);if(u.origin!==base.origin||!u.pathname.startsWith(base.pathname))throw Error('素材必须位于当前目录');return u.href;}
    function validate(data){if(data?.schemaVersion!==1||data.canvas?.width!==1024||data.canvas?.height!==1536)throw Error('清单版本或固定画幅不正确');if(!Array.isArray(data.frames)||data.frames.length!==8)throw Error('清单需要列出全部八个计划阶段；尚未生成的图片可保留路径');const ids=new Set(),paths=new Set(),phases=new Set();for(const [index,f] of data.frames.entries()){if(!f.id||ids.has(f.id)||!f.path||paths.has(f.path)||!Number.isInteger(f.phase)||f.phase<1||f.phase>8||phases.has(f.phase))throw Error('帧标识、路径与阶段必须唯一');if(f.phase!==index+1)throw Error('清单必须按阶段 1–8 排列，避免误排动作顺序');if(!Number.isFinite(f.durationMs)||f.durationMs<40||f.durationMs>10000)throw Error('每帧 durationMs 需要在 40–10000 毫秒之间');asset(f.path);ids.add(f.id);paths.add(f.path);phases.add(f.phase);}}
    function noteLines(id,lines){const values=Array.isArray(lines)?lines:[];$(id).replaceChildren(...values.map(value=>{const p=document.createElement('p');p.textContent=String(value);return p;}));}
    function ready(){return sequence?.frames.length===8&&states.length===8&&states.every(s=>s.status==='loaded'&&s.image.naturalWidth===1024&&s.image.naturalHeight===1536);}
    function playState(){const enabled=ready();$('play').disabled=!enabled;$('play').textContent=playing?'暂停检查':'动作检查播放';$('playNote').textContent=playing?'正在播放 8 帧动作粗检查；请观察脚部接触、近远腿和手部衔接。尚非运行时验收。':enabled?'八张均已加载。可以播放 8 帧动作粗检查；当前暂停，尚非运行时验收。':'八张全部加载成功后，可进行 8 帧动作粗检查。当前暂停；这不是运行时验收。';}
    function pause(){playing=false;cancelAnimationFrame(raf);raf=0;elapsed=0;playState();}
    function renderStatus(){const count=states.filter(s=>s.status==='loaded').length;$('summary').textContent=`已加载 ${count} / 8 张实际素材 · ${count===8?'可进行动作粗检查':'未就绪的位置保留占位'} · 动作连续性待复核`;tiles.forEach((t,i)=>{const f=sequence.frames[i],s=states[i];t.placeholder.hidden=s.status==='loaded';t.img.hidden=s.status!=='loaded';t.placeholder.textContent=s.status==='size-mismatch'?'尺寸不符，未加入播放':s.status==='loading'?'正在读取…':'待生成 / 暂未加载';const review=names[f.reviewStatus]||'待复核';t.note.textContent=`${s.status==='loaded'?'已加载':s.status==='loading'?'读取中':'未就绪'} · ${review}${f.notes?.length?' · '+f.notes.join('；'):''}`;});if(playing&&!ready())pause();show(current,false);playState();}
    function place(win,canvas,area,scale){win.style.width=area.w*scale+'px';win.style.height=area.h*scale+'px';canvas.style.width=1024*scale+'px';canvas.style.height=1536*scale+'px';canvas.style.transform=`translate(${-area.x*scale}px,${-area.y*scale}px)`;}
    function layout(reset=false){if(!sequence)return;const a=areas[$('focus').value];if(tiles.length){const scale=Math.max(.04,Math.min(...tiles.map(t=>(t.stage.clientWidth-10)/a.w),...tiles.map(t=>(t.stage.clientHeight-10)/a.h)));tiles.forEach(t=>place(t.window,t.canvas,a,scale));}const stage=$('singleStage'),scale=$('zoom').value==='fit'?Math.max(.04,Math.min((stage.clientWidth-16)/a.w,(stage.clientHeight-16)/a.h)):Number($('zoom').value);place($('singleWindow'),$('singleCanvas'),a,scale);if(reset){stage.scrollTop=0;stage.scrollLeft=0;}}
    function show(index,manual=true){if(!sequence||!states.length)return;if(manual)pause();current=Math.max(0,Math.min(index,7));const f=sequence.frames[current];states.forEach((s,i)=>{s.image.hidden=i!==current||s.status!=='loaded';});tiles.forEach((t,i)=>{t.root.classList.toggle('selected',i===current);t.button.setAttribute('aria-pressed',String(i===current));});$('frameTitle').textContent=f.label||f.id;$('frameSelect').value=String(current);$('previous').disabled=current===0;$('next').disabled=current===7;const s=states[current];$('singlePlaceholder').hidden=s.status==='loaded';$('singlePlaceholder').textContent=s.status==='size-mismatch'?'画幅不符，未自动缩放纠正':s.status==='loading'?'正在读取素材…':'此帧待生成 / 暂未加载';$('download').href=asset(f.path);$('download').download=f.path.split('/').pop();$('download').setAttribute('aria-disabled',String(s.status!=='loaded'));noteLines('frameNotes',[`${names[f.reviewStatus]||'待复核'} · 当前帧 ${f.durationMs} ms`,...(Array.isArray(f.notes)?f.notes:[])]);}
    function scheduleRetry(){clearTimeout(retryTimer);retryTimer=null;if(sequence&&!document.hidden&&states.some(s=>s.status!=='loaded'))retryTimer=setTimeout(()=>{states.forEach((s,i)=>{if(s.status!=='loaded'&&s.status!=='loading')loadImage(i,epoch);});},8000);}
    function loadImage(i,loadEpoch){const s=states[i],token=++s.token,img=s.image;s.status='loading';renderStatus();const validToken=()=>loadEpoch===epoch&&token===s.token;const fail=status=>{if(!validToken())return;s.status=status;renderStatus();scheduleRetry();};img.onload=async()=>{try{if(img.decode)await img.decode();}catch{return fail('missing');}if(!validToken())return;if(img.naturalWidth!==1024||img.naturalHeight!==1536)return fail('size-mismatch');s.status='loaded';tiles[i].img.src=img.src;renderStatus();scheduleRetry();};img.onerror=()=>fail('missing');img.src=asset(sequence.frames[i].path)+'?loaded='+Date.now();}
    function tick(now){if(!playing)return;if(!ready())return pause();elapsed+=Math.min(now-lastTime,1000)*Number($('speed').value);lastTime=now;let changed=false;while(elapsed>=sequence.frames[current].durationMs){elapsed-=sequence.frames[current].durationMs;current=(current+1)%8;changed=true;}if(changed)show(current,false);raf=requestAnimationFrame(tick);}
    function togglePlayback(){if(playing)return pause();if(!ready())return;playing=true;elapsed=0;lastTime=performance.now();playState();raf=requestAnimationFrame(tick);}
    function build(){const options=[];sequence.frames.forEach((f,i)=>{const image=new Image();image.alt=f.label||f.id;image.hidden=true;image.draggable=false;image.decoding='async';$('singleCanvas').append(image);states.push({image,status:'waiting',token:0});const root=document.createElement('article'),head=document.createElement('div'),button=document.createElement('button'),download=document.createElement('a'),stage=document.createElement('div'),win=document.createElement('div'),canvas=document.createElement('div'),img=document.createElement('img'),placeholder=document.createElement('div'),note=document.createElement('p');root.className='tile';head.className='tile-head';button.type='button';button.textContent=f.label||f.id;button.onclick=()=>show(i);download.href=asset(f.path);download.download=f.path.split('/').pop();download.textContent='原图 ↓';stage.className='stage grid-stage';win.className='window';canvas.className='canvas';placeholder.className='placeholder';placeholder.textContent='待生成';img.alt=f.label||f.id;img.hidden=true;img.draggable=false;note.className='tile-note';canvas.append(img);win.append(canvas,placeholder);stage.append(win);head.append(button,download);root.append(head,stage,note);$('grid').append(root);tiles.push({root,button,stage,window:win,canvas,img,placeholder,note});const option=document.createElement('option');option.value=String(i);option.textContent=f.label||f.id;options.push(option);});$('frameSelect').replaceChildren(...options);$('frameSelect').disabled=false;layout();show(0,false);renderStatus();states.forEach((_,i)=>loadImage(i,epoch));}
    async function load(){pause();clearTimeout(retryTimer);const loadEpoch=++epoch;sequence=null;states=[];tiles=[];current=0;$('grid').replaceChildren();$('singleCanvas').replaceChildren();$('frameSelect').replaceChildren();$('frameSelect').disabled=true;$('previous').disabled=true;$('next').disabled=true;$('reload').disabled=true;$('error').hidden=true;$('summary').textContent='正在读取素材清单…';$('singlePlaceholder').hidden=false;$('singlePlaceholder').textContent='正在读取清单…';playState();try{const response=await fetch('sequence-v11.json',{cache:'no-store'});if(!response.ok)throw Error('清单读取失败：HTTP '+response.status);const data=await response.json();validate(data);if(loadEpoch!==epoch)return;sequence=data;$('title').textContent=data.title||'侧走素材 · 8个关键姿势';document.title=$('title').textContent;noteLines('reviewNotes',[names[data.review?.status]||'待复核',...(Array.isArray(data.review?.notes)?data.review.notes:[])]);build();}catch(error){if(loadEpoch!==epoch)return;$('error').hidden=false;$('error').textContent=error.message;$('summary').textContent='清单未就绪；未启用动作检查播放。';}finally{if(loadEpoch===epoch)$('reload').disabled=false;}}
    $('background').onchange=()=>document.body.className=$('background').value;$('focus').onchange=()=>{layout(true);};$('zoom').onchange=()=>layout(true);$('previous').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('frameSelect').onchange=()=>show(Number($('frameSelect').value));$('play').onclick=togglePlayback;$('reload').onclick=load;
    $('download').onclick=event=>{if(!states[current]||states[current].status!=='loaded')event.preventDefault();};
    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();clearTimeout(retryTimer);}else{layout();scheduleRetry();}});window.addEventListener('resize',()=>layout());load();
  </script>
</body>
</html>
