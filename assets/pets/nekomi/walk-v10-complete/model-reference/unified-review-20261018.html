<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>猫娘统一母稿复核 20261018</title><style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;padding:24px;color:#243d31;background:#eef2ec}h1{font-size:24px;margin:0 0 12px}button,select{font:inherit;padding:7px}nav{display:flex;gap:20px;align-items:center;margin-bottom:18px}.row{display:flex;gap:16px;align-items:flex-start}.card{background:white;border:1px solid #bccabd;padding:12px;min-width:0}.card h2{font-size:16px;margin:0 0 10px}.stage,.focus{overflow:hidden;position:relative;background-color:#f7f7f3;background-image:conic-gradient(#d8dfd5 25%,transparent 0 50%,#d8dfd5 0 75%,transparent 0);background-size:24px 24px}body.light .stage,body.light .focus{background:#fff9ee}body.dark .stage,body.dark .focus{background:#1b2520}.stage img{display:block;width:100%;height:100%}.stage{width:358.4px;height:537.6px}.focus{width:480px;height:330px;margin-top:10px}.focus img{position:absolute;width:1024px;height:1536px;max-width:none}.focus.tail img{left:-290px;top:-650px}.focus.hand img{left:-470px;top:-700px}.focus.feet img{left:-350px;top:-1206px}.details{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}.note{line-height:1.7;margin:10px 0 16px;max-width:1200px}.hide{display:none}a{color:#245e3b}.label{font-size:12px;opacity:.7}</style>
<h1>统一母稿 · 原始 PNG 实际显示</h1><p class="note">制作基准：按用户要求保留轻微比例和装饰差异。三图使用共同画布和相同缩放；局部为原图视窗，无图像改写。</p>
<nav><label>背景 <select id="bg"><option value="checker">棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>显示 <select id="size"><option value="compare">共同尺度对比</option><option value="desktop">单图人物约 300px</option><option value="large">单图人物约 1200px</option></select></label><label>当前图 <select id="asset"></select></label><span id="loaded"></span></nav>
<div class="row" id="cards"></div><div class="details" id="details"></div>
<script>
const items=[['front','正面 v2','master-front-v2.png',1473],['back','背面 v4','master-back-v4.png',1474],['right','右侧 v3','master-right-v3.png',1508]];
const cards=document.querySelector('#cards'),details=document.querySelector('#details'),sel=document.querySelector('#asset');let loaded=0;
for(const [id,label,file] of items){sel.add(new Option(label,id));const c=document.createElement('article');c.className='card';c.dataset.id=id;c.innerHTML='<h2>'+label+'</h2><div class="stage"><img src="'+file+'" alt="'+label+'"></div><p class="label">1024 × 1536 · 原始 PNG</p>';c.querySelector('img').onload=()=>document.querySelector('#loaded').textContent=++loaded+'/3 已加载';cards.append(c)}
sel.value='right';
function layout(){document.body.className=document.querySelector('#bg').value;const size=document.querySelector('#size').value,id=sel.value,item=items.find(i=>i[0]===id);for(const c of cards.children){c.classList.toggle('hide',size!=='compare'&&c.dataset.id!==id);const s=size==='compare'?.35:(size==='large'?1200:300)/item[3],stage=c.querySelector('.stage');stage.style.width=1024*s+'px';stage.style.height=1536*s+'px'}details.innerHTML='';for(const [cls,title] of [['tail','尾根与后裙口'],['hand','近臂与手'],['feet','近远鞋体']]){const c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+title+'</h2><div class="focus '+cls+'"><img src="'+item[2]+'" alt="'+title+'"></div>';details.append(c)}}
for(const s of document.querySelectorAll('select'))s.onchange=layout;layout();
</script></html>
