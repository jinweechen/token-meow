<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
 <title>06 · 远腿承重 / 近腿离地回收</title><desc>纯代码姿势约束，候选角色像素尺寸；不是人物素材或验收。固定近青远灰，远侧先画；虚线为被遮挡的连接。腿段 280/280 px，地面 y=1483。</desc>
 <rect width="1024" height="1536" fill="white"/>
 <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#2c423a"><text x="55" y="76" font-size="30" font-weight="700">06 · 远腿承重 / 近腿离地回收</text><text x="55" y="122" font-size="20">远脚全掌落地；近脚短距离回收，鞋底离地 35 px。</text><text x="55" y="162" font-size="18" fill="#6c7a70">面向右 → · 固定画幅 1024×1536 · 地面 y=1483</text><text x="55" y="196" font-size="18" fill="#6c7a70">绘图约束，非人物成品或验收；不按成人工程比例重映射。</text>
 <rect x="55" y="238" width="22" height="22" rx="5" fill="#58c3b8"/><text x="88" y="257" font-size="19">近侧：离地回收</text><rect x="490" y="238" width="22" height="22" rx="5" fill="#b7bdc5"/><text x="523" y="257" font-size="19">远侧：全掌承重</text>
 <text x="55" y="310" font-size="18" fill="#6c7a70">腿段均为 280 px；鞋底长 220 px。允许遮挡，不把远鞋移开求完整。</text><text x="55" y="342" font-size="18" fill="#6c7a70">灰虚线表示隐藏骨架；手臂随同侧腿反向摆动。</text></g>
