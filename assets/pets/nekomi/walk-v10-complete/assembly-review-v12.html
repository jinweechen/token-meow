<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>侧面分层制作素材装配</title><style>*{box-sizing:border-box}body{font:14px system-ui;background:#edf3ea;color:#243c2d;margin:0;padding:24px}h1{font-size:24px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:15px 0}select,button{font:inherit;padding:8px}.row{display:flex;gap:16px}.card{background:white;border:1px solid #c3d1bd;padding:10px}.stage{background:#fbfcf8;background-image:conic-gradient(#dce5d7 25%,transparent 0 50%,#dce5d7 0 75%,transparent 0);background-size:24px 24px}canvas,.stage img{display:block;width:430px;height:645px}body.dark .stage{background:#202920}body.light .stage{background:#fff9ed}.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1400px;margin-top:20px}label{background:white;padding:8px}p{line-height:1.7}.note{color:#6e7055}#status{font-size:13px}</style><h1>18 张侧面分层素材 · 双向装配预览</h1><p class="note">原始 PNG 保持不变；此处仅实时放置和旋转已绘制部件。左向为原部件显示镜像并交换左右肢体身份，PNG字节不变；独立左向序列为新绘制。用于检查连接和遮挡，不是绑定工程。</p><div class="controls"><label>方向 <select id="direction"><option value="right">朝右 · 原件</option><option value="left">朝左 · 显示镜像复用</option></select></label><label>背景 <select id="bg"><option value="checker">棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>动作范围 <select id="pose"></select></label><button id="animate">循环检查关节</button><button id="all">恢复全部图层</button><label>大小 <select id="size"><option value="645">对比</option><option value="280">桌宠</option><option value="1230">人物约1200px</option></select></label></div><p id="status">加载中</p><div class="row"><div class="card"><h2>原始侧面母稿</h2><div class="stage"><img id="reference" src="model-reference/master-right-v3.png"></div></div><div class="card"><h2>中性装配</h2><div class="stage"><canvas id="neutral" width="1024" height="1536"></canvas></div></div><div class="card"><h2>关节与遮挡检查</h2><div class="stage"><canvas id="motion" width="1024" height="1536"></canvas></div></div></div><div class="layers" id="layers"></div><script>
let m,loaded=new Map(),hidden=new Set(),running=false,start=0,frames=0;const $=id=>document.getElementById(id);const ctx1=$('neutral').getContext('2d'),ctx2=$('motion').getContext('2d');
function parents(layer){const result=[];let p=layer.parent;while(p){const l=m.layers.find(x=>x.id===p);if(!l)throw Error('Missing parent '+p);result.unshift(l);p=l.parent}return result}
function draw(ctx,angles){ctx.clearRect(0,0,1024,1536);ctx.save();ctx.transform(...m.views[$('direction').value].canvasTransform);for(const l of [...m.layers].sort((a,b)=>a.zIndex-b.zIndex)){if(hidden.has(l.id))continue;ctx.save();for(const bone of [...parents(l),l]){const a=angles[bone.id]||0;if(a){ctx.translate(...bone.pivot);ctx.rotate(a*Math.PI/180);ctx.translate(-bone.pivot[0],-bone.pivot[1])}}ctx.transform(...l.placement);ctx.drawImage(loaded.get(l.id),0,0);ctx.restore()}ctx.restore();frames++}
function render(){draw(ctx1,{});draw(ctx2,m.rangePresets[$('pose').value]||{})}
function tick(t){if(!running)return;const a=m.rangePresets['near-forward'],f=m.rangePresets['far-forward'],u=(Math.sin((t-start)/800)+1)/2,angles={};for(const id of new Set([...Object.keys(a),...Object.keys(f)]))angles[id]=(a[id]||0)*(1-u)+(f[id]||0)*u;draw(ctx2,angles);requestAnimationFrame(tick)}
$('direction').onchange=()=>{$('reference').src=m.views[$('direction').value].reference;for(const label of document.querySelectorAll('#layers label')){const id=label.dataset.id;label.lastChild.textContent=' '+(m.views[$('direction').value].displayIdMapping?.[id]||id)};render()};$('bg').onchange=()=>document.body.className=$('bg').value;$('pose').onchange=()=>{running=false;$('animate').textContent='循环检查关节';render()};$('animate').onclick=()=>{running=!running;$('animate').textContent=running?'暂停':'循环检查关节';if(running){start=performance.now();requestAnimationFrame(tick)}};$('all').onclick=()=>{hidden.clear();for(const c of document.querySelectorAll('input'))c.checked=true;render()};$('size').onchange=()=>{const h=Number($('size').value);for(const c of document.querySelectorAll('canvas,.stage img')){c.style.height=h+'px';c.style.width=h*2/3+'px'}};
fetch('layer-manifest-v12.json',{cache:'no-store'}).then(r=>r.json()).then(async data=>{m=data;for(const l of m.layers){const im=new Image();im.src=l.path;await im.decode();loaded.set(l.id,im);const label=document.createElement('label');label.dataset.id=l.id;label.innerHTML='<input type="checkbox" checked> '+l.id+' · z'+l.zIndex;label.querySelector('input').onchange=e=>{e.target.checked?hidden.delete(l.id):hidden.add(l.id);render()};$('layers').append(label)}for(const p of Object.keys(m.rangePresets))$('pose').add(new Option(p,p));$('status').textContent=loaded.size+'/18 原生 PNG 已加载 · 共用画布1024×1536';render()});
window.layerState=()=>({loaded:loaded.size,hidden:[...hidden],pose:$('pose').value,running,drawCount:frames,direction:$('direction').value,method:m?.views[$('direction').value].method||'original'});</script></html>
