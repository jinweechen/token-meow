[package]
name = "token-meow"
version = "0.1.0"
description = "Token 喵 — 本地只读 Codex 用量账本与二次元猫娘桌宠"
authors = ["Token Meow contributors"]
edition = "2021"
rust-version = "1.96"
publish = false

[lib]
name = "token_meow_lib"
crate-type = ["rlib"]

[[bin]]
name = "token-meow"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-build",
  "dep:open",
  "dep:windows",
]
custom-protocol = ["desktop", "tauri/custom-protocol"]
headless-audit = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [], optional = true }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "=2.7.2", optional = true }
tauri-plugin-single-instance = { version = "=2.4.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
open = { version = "=5.4.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemServices"] }
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
